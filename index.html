<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>survey_form</title>
    <link rel="stylesheet" href="asset/style/survey.css" />
  </head>
  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">
      Thank you for taking the time to help us improve the platform
    </p>

    <form id="survey-form">
      <fieldset>
        <label for="name" id="name-label">
          Enter your name:
          <input id="name" type="text" placeholder="your name:" required />
        <label>

        <label for="email" id="email-label">
          Enter your Email:
          <input id="email" type="email" placeholder="your email:" required />
        </label>

        <label for="age" id="number-label">
          Enter your Age:
          <input
            id="age"
            type="number"
            min="12"
            max="100"
            placeholder="your age:"
          />
        </label>
      </fieldset>

      <hr />

      <fieldset>
        <label>
          Which option best describes your current role?
          <select id="dropdown">
            <option>Select current role</option>
            <option>None</option>
            <option>Masters</option>
            <option>Bachelor</option>
            <option>High School</option>
          </select>
        </label>

        <p>Would you recommend freeCodeCamp to a friend?</p>

        <label class="radio-btn">
          <input type="radio" name="pref-format" /> Definitely
        </label>

        <label class="radio-btn">
          <input type="radio" name="pref-format" /> Maybe
        </label>

        <label class="radio-btn">
          <input type="radio" name="pref-format" /> Not sure
        </label>

        <p>What is your favorite feature of freeCodeCamp?</p>

        <label>
          <select id="dropdown1">
            <option>Select an option</option>
            <option>Challenges</option>
            <option>Projects</option>
            <option>Community</option>
            <option>Open Source</option>
          </select>
        </label>

        <p>What would you like to see improved? (check all that apply)</p>

        <label class="style-btn">
          <input type="checkbox" value="choose" /> Front-end Projects
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Back-end Projects
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Data Visualization
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Challenges
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Open Source Community
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Gitter help rooms
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Videos
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> City Meetups
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Wiki
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Forum
        </label>
        <label class="style-btn">
          <input type="checkbox" value="choose" /> Additional Courses
        </label>
      </fieldset>

      <hr />

      <fieldset>
        <label for="comments">
          Any comments or suggestions?
          <textarea
            id="comments"
            rows="5"
            cols="35"
            placeholder="Enter your comment here..."
          ></textarea>
        </label>

        <button id="submit" type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
